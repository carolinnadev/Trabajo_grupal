<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión de la Plataforma de Eventos.">
    <title>Iniciar sesión | Plataforma de Eventos</title>
</head>
<body>
    <header>
        <a href="../index.html">Plataforma de Eventos</a>
        <nav aria-label="Navegación principal">
            <a href="../index.html">Volver al inicio</a>
        </nav>
    </header>

    <main>
        <section aria-labelledby="titulo-login">
            <h1 id="titulo-login">Iniciar sesión</h1>
            <p>Ingresa tus credenciales para consultar los eventos.</p>

            <form id="formulario-login">
                <div>
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" autocomplete="username" required>
                </div>

                <div>
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
                </div>

                <button type="submit">Ingresar</button>
            </form>

            <p id="mensaje-login" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Organización de Eventos. Todos los derechos reservados.</p>
    </footer>
    <script src="../js/login.js"></script>
</body>
</html>
